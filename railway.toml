# Railway config — deploys the root Dockerfile. Railway sets PORT at runtime;
# csms_live.py detects it and serves HTTP + the OCPP WebSocket on that one port.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
